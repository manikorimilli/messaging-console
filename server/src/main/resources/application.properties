spring.application.name=messaging-service

# Optional local settings: a ".env" file next to the project (git-ignored) can set any of the
# settings below for local runs. Real environment variables take precedence.
spring.config.import=optional:file:.env[.properties]

# Shared HTTP client settings for every RestClient.Builder (all provider adapters).
# The JDK HttpClient is pinned so network errors always look the same to MessageService.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=10s
spring.http.clients.imperative.factory=jdk

# Providers registered through /api/v1/providers are kept here (created empty on first start).
# It holds real secrets, so it is git-ignored. On a server, point it at storage that survives
# redeploys, e.g. MESSAGING_DBFILE=/home/data/db.json
messaging.db-file=./db.json

# Health check for Azure and uptime checks: GET /actuator/health returns "status":"UP".
# Only this endpoint is exposed, and it shows the status only, no details.
management.endpoints.web.exposure.include=health
