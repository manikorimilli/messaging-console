# Checks the Windows one-line setup on a clean Windows machine: get.ps1 downloads the
# code and runs init.ps1 (which downloads Java and Node.js), then run.ps1 must serve
# the web console and reach the server.
name: Windows setup

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'get.ps1'
      - 'init.ps1'
      - 'run.ps1'
      - 'run.cmd'
      - 'scripts/tools-env.ps1'
      - '.github/workflows/windows-setup.yml'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        download: [git, zip]
    steps:
      - name: Setup with the one-line command (get.ps1)
        shell: powershell
        env:
          MESSAGING_CONSOLE_BRANCH: ${{ github.ref_name }}
          MC_NO_GIT: ${{ matrix.download == 'zip' && '1' || '0' }}
          MC_FORCE_DOWNLOAD: '1'
        run: |
          Set-Location $env:RUNNER_TEMP
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/get.ps1" | iex
          if (-not (Test-Path "$env:RUNNER_TEMP\messaging-console\server\target")) { throw "Setup did not finish" }
          Get-ChildItem "$env:RUNNER_TEMP\messaging-console\.tools"

      - name: Start with run.ps1 and check the console
        shell: powershell
        run: |
          $app = "$env:RUNNER_TEMP\messaging-console"
          $p = Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$app\run.ps1" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\run.out" -RedirectStandardError "$env:RUNNER_TEMP\run.err"
          $ready = $false
          for ($i = 0; $i -lt 180; $i++) {
            if ((Test-Path "$env:RUNNER_TEMP\run.out") -and (Select-String -Path "$env:RUNNER_TEMP\run.out" -Pattern 'Ready' -Quiet)) { $ready = $true; break }
            if ($p.HasExited) { break }
            Start-Sleep -Seconds 1
          }
          Get-Content "$env:RUNNER_TEMP\run.out"
          Get-Content "$env:RUNNER_TEMP\run.err" -ErrorAction SilentlyContinue
          if (-not $ready) { Get-Content "$app\logs\*.log" -ErrorAction SilentlyContinue; throw "run.ps1 did not reach Ready" }
          $page = Invoke-WebRequest -UseBasicParsing http://localhost:5173/
          if ($page.Content -notmatch '<title>Messaging Console</title>') { throw "Console page not served" }
          $api = Invoke-WebRequest -UseBasicParsing http://localhost:5173/api/v1/providers
          Write-Host "providers via console: $($api.StatusCode) $($api.Content)"
          if ($api.StatusCode -ne 200) { throw "Console could not reach the server" }
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'messaging-service|vite.js' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
